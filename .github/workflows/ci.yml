name: CI Checks
on:
  pull_request:
    branches: [develop, master]
  # Allow reuse from other workflows (e.g. develop-deploy.yml) to avoid duplication.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python

  lint:
    name: lint check
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python
      - run: uv run ruff check

  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python environment
        uses: ./.github/actions/setup-python
      - run: uv run pytest tests/unit --cov=src --cov-report=term-missing

  trivy:
    name: Trivy security scan
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Scan filesystem for vulnerabilities
        # Non-blocking by default (exit-code 0); tighten to fail the build on
        # CRITICAL findings by setting exit-code: '1' once baselined.
        run: trivy fs --severity HIGH,CRITICAL --exit-code 0 --format table .
