name: Develop Build & Publish

# Runs after a merge/push to develop (i.e. once a PR is merged into develop).
on:
  push:
    branches: [develop]

# Serialize runs on the same ref. The tag job pushes a *tag* (not a branch
# commit), so it does not re-trigger this branch-only workflow — no loop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # Reuse the exact CI flow (setup -> lint -> test -> trivy) from ci.yml.
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  tag:
    name: Create develop tag
    needs: ci
    runs-on: ubuntu-latest
    # Needed to push the git tag back to the repo.
    permissions:
      contents: write
    outputs:
      name: ${{ steps.tag.outputs.name }}
      git_tag: ${{ steps.tag.outputs.git_tag }}
      image_repo: ${{ steps.tag.outputs.image_repo }}
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          # Full history + tags so the tag step can read existing develop-*
          # tags to compute the next semver patch.
          fetch-depth: 0
          fetch-tags: true
      - name: Create git tag
        id: tag
        # Pass the token via env (not inline in the run step) so the secret is
        # never expanded directly in a shell command (SonarCloud rule) and is
        # masked in logs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Name comes from pyproject.toml.
          NAME=$(grep -m1 '^name' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # --- Compute the next develop tag (develop-MAJOR.MINOR.PATCH) -------
          # Idempotent: if THIS commit is already released under a develop-*
          # tag, reuse it and skip creation (safe re-runs of the same SHA).
          # Only well-formed develop-X.Y.Z tags count (same filter as LATEST),
          # so a legacy develop-<sha> on HEAD can't become GIT_TAG/image_tag.
          EXISTING=$(git tag --points-at HEAD --list 'develop-*' \
                     | grep -E '^develop-[0-9]+\.[0-9]+\.[0-9]+$' \
                     | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)
          if [ -n "$EXISTING" ]; then
            GIT_TAG="$EXISTING"
            CREATE_TAG=false
            echo "Commit already tagged as $GIT_TAG; will not create a new tag."
          else
            # Highest existing develop-X.Y.Z tag (well-formed semver only);
            # legacy develop-<sha> tags are ignored by the semver filter.
            LATEST=$(git tag --list 'develop-*' \
                     | sed -E 's/^develop-//' \
                     | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
                     | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)
            if [ -z "$LATEST" ]; then
              NEXT="0.0.1"                     # no prior develop tag -> seed
            else
              MAJOR=${LATEST%%.*}; REST=${LATEST#*.}
              MINOR=${REST%%.*};  PATCH=${REST##*.}
              # 10# forces base-10 so a leading-zero patch (e.g. 08) isn't octal.
              NEXT="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"   # patch-only bump
            fi
            GIT_TAG="develop-${NEXT}"
            CREATE_TAG=true
          fi
          {
            echo "name=$NAME"
            echo "git_tag=$GIT_TAG"
            echo "image_repo=$NAME"
            echo "image_tag=$GIT_TAG"
          } >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Push-scoped credential flow: supply the token via GIT_ASKPASS so it
          # is never written into .git/config or the remote URL. persist-
          # credentials is false, so the checkout stored nothing on disk.
          printf '#!/bin/sh\necho "$GITHUB_TOKEN"\n' > "$RUNNER_TEMP/askpass.sh"
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          export GIT_USERNAME=x-access-token
          # Only create/push when we minted a new tag; a commit already tagged
          # (CREATE_TAG=false) reuses its existing tag with nothing to push.
          if [ "$CREATE_TAG" = true ]; then
            git tag -a "$GIT_TAG" -m "Release $GIT_TAG"
            git push origin "$GIT_TAG"
          else
            echo "Reusing existing tag $GIT_TAG; nothing to push."
          fi

  build:
    name: Build image
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.tag.outputs.image_repo }}
          GIT_TAG: ${{ needs.tag.outputs.git_tag }}
        run: |
          # Tag the image with the git tag (reused as-is).
          docker build -t "$IMAGE:$GIT_TAG" .
          docker save "$IMAGE:$GIT_TAG" > image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image
          path: image.tar

  push:
    name: Push image to GHCR
    needs: [build, tag]
    runs-on: ubuntu-latest
    # Needed to push the image to GHCR.
    permissions:
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image
          path: .
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load and push image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.tag.outputs.image_repo }}
          GIT_TAG: ${{ needs.tag.outputs.git_tag }}
        run: |
          docker load < image.tar
          docker push "$IMAGE:$GIT_TAG"
